<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="Segoe UI, Arial, sans-serif">
  <title>AlthermaInterface system with temperature sensors</title>
  <rect width="1300" height="640" fill="#ffffff"/>

  <!-- Outdoor unit and link -->
  <rect x="30" y="260" width="130" height="90" rx="6" fill="#f3efe9" stroke="#888"/>
  <text x="95" y="310" text-anchor="middle" font-size="14">Outdoor unit</text>
  <line x1="160" y1="305" x2="240" y2="305" stroke="#999" stroke-dasharray="5 4"/>

  <!-- Indoor unit -->
  <rect x="240" y="230" width="170" height="190" rx="6" fill="#e6f4ef" stroke="#2e7d6b"/>
  <text x="325" y="252" text-anchor="middle" font-size="14">Indoor unit</text>
  <circle cx="280" cy="330" r="12" fill="#ffffff" stroke="#2e7d6b"/>
  <text x="280" y="334" text-anchor="middle" font-size="10">P0</text>
  <rect x="290" y="372" width="60" height="18" fill="#ffffff" stroke="#2e7d6b"/>
  <text x="320" y="385" text-anchor="middle" font-size="10">3-way valve</text>

  <!-- Water and refrigerant paths -->
  <!-- HP outlet: supply to buffer top -->
  <path d="M410 270 H480" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- DHW coil supply and return -->
  <path d="M300 230 V170" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M280 170 V230" stroke="#2471a3" stroke-width="3" fill="none"/>
  <!-- Buffer top outlet to consumers -->
  <path d="M590 250 H640" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Manifold -->
  <rect x="640" y="215" width="12" height="130" fill="#d5d8dc" stroke="#7f8c8d"/>
  <text x="646" y="362" text-anchor="middle" font-size="11">Manifold</text>
  <!-- House direct circuit -->
  <path d="M652 232 H700" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Floor supply through mixing valve -->
  <path d="M652 345 V360 H700" stroke="#c0392b" stroke-width="3" fill="none"/>
  <circle cx="646" cy="372" r="9" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="646" y="376" text-anchor="middle" font-size="9">mix</text>
  <!-- House and floor returns to the common return -->
  <path d="M840 250 V520" stroke="#2471a3" stroke-width="3" fill="none"/>
  <path d="M840 360 H860 V520" stroke="#2471a3" stroke-width="3" fill="none"/>
  <!-- Common return to indoor unit inlet -->
  <path d="M860 520 H262 V420" stroke="#2471a3" stroke-width="3" fill="none"/>
  <!-- Buffer bottom return joins the common return -->
  <path d="M480 440 H262" stroke="#2471a3" stroke-width="3" fill="none"/>

  <!-- DHW tank -->
  <rect x="240" y="40" width="120" height="120" rx="6" fill="#f8f0e3" stroke="#8a6d3b"/>
  <text x="300" y="70" text-anchor="middle" font-size="14">DHW tank</text>

  <!-- Buffer tank -->
  <rect x="480" y="200" width="110" height="250" rx="6" fill="#f9ece6" stroke="#b35c3a"/>
  <text x="535" y="225" text-anchor="middle" font-size="14">Buffer tank</text>

  <!-- Living room, not on the water loop -->
  <rect x="700" y="60" width="140" height="60" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="770" y="95" text-anchor="middle" font-size="13">Living room</text>

  <!-- House and floor circuits -->
  <rect x="700" y="190" width="140" height="60" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="770" y="225" text-anchor="middle" font-size="13">House, direct</text>
  <rect x="700" y="330" width="140" height="60" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="770" y="365" text-anchor="middle" font-size="13">Floor, mixed</text>

  <!-- Sensor markers: numbered circles -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="95" cy="240" r="11" fill="#fff6d6" stroke="#b08900"/><text x="95" y="245">1</text>
    <circle cx="320" cy="300" r="11" fill="#d6f0e0" stroke="#1e7a4a"/><text x="320" y="305">2</text>
    <circle cx="262" cy="440" r="11" fill="#d6f0e0" stroke="#1e7a4a"/><text x="262" y="445">3</text>
    <circle cx="425" cy="246" r="11" fill="#d6f0e0" stroke="#1e7a4a"/><text x="425" y="251">4</text>
    <circle cx="455" cy="300" r="11" fill="#d6e6f6" stroke="#1f5fa0"/><text x="455" y="305">5</text>
    <circle cx="390" cy="520" r="11" fill="#d6e6f6" stroke="#1f5fa0"/><text x="390" y="525">6</text>
    <circle cx="330" cy="150" r="11" fill="#d6f0e0" stroke="#1e7a4a"/><text x="330" y="155">8</text>
    <circle cx="470" cy="246" r="11" fill="#fff6d6" stroke="#b08900"/><text x="470" y="251">9</text>
    <circle cx="605" cy="232" r="11" fill="#fff6d6" stroke="#b08900"/><text x="605" y="237">10</text>
    <circle cx="470" cy="440" r="11" fill="#fff6d6" stroke="#b08900"/><text x="470" y="445">11</text>
    <circle cx="652" cy="236" r="11" fill="#fff6d6" stroke="#b08900"/><text x="652" y="241">12</text>
    <circle cx="840" cy="300" r="11" fill="#fff6d6" stroke="#b08900"/><text x="840" y="305">13</text>
    <circle cx="675" cy="360" r="11" fill="#fff6d6" stroke="#b08900"/><text x="675" y="365">14</text>
    <circle cx="860" cy="440" r="11" fill="#fff6d6" stroke="#b08900"/><text x="860" y="445">15</text>
    <circle cx="745" cy="108" r="11" fill="#e4e6f7" stroke="#4a4e9c"/><text x="745" y="113">16</text>
    <circle cx="805" cy="108" r="11" fill="#e4e6f7" stroke="#4a4e9c"/><text x="805" y="113">17</text>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <text x="880" y="30" font-size="15" font-weight="bold">Temperature sensors</text>
    <text x="880" y="48" font-size="11" fill="#555">Green: heat pump (espaltherma, native). Blue: ESPEasy node, pipe clamp.</text>
    <text x="880" y="62" font-size="11" fill="#555">Yellow: ESPEasy node, circuit or tank. Node assignment from notes; confirm.</text>

    <text x="880" y="90">1  sensor.tempute           outdoor air (node .160)</text>
    <text x="880" y="112">2  espaltherma_refrig_temp_liquid_sidec   refrigerant liquid, indoor unit</text>
    <text x="880" y="134">3  espaltherma_inlet_water_tempc      heat pump water inlet</text>
    <text x="880" y="156">4  espaltherma_outlet_water_tempc     heat pump water outlet</text>
    <text x="880" y="178">5  sensor.turmaskin                  heat pump flow pipe, location to confirm</text>
    <text x="880" y="200">6  sensor.returmaskin                heat pump return, location to confirm</text>
    <text x="880" y="222">8  espaltherma_dhw_tank_tempc        DHW tank</text>
    <text x="880" y="244">9  sensor.tempinnlagertank           buffer top, heat pump supply in</text>
    <text x="880" y="266">10 sensor.turlager                   buffer top, supply to consumers</text>
    <text x="880" y="288">11 sensor.temputlagertank            buffer bottom, return to indoor unit</text>
    <text x="880" y="310">12 sensor.temputfordeler             manifold, house flow (same pipe as 10)</text>
    <text x="880" y="332">13 sensor.tempreturfordeler          house return to common return</text>
    <text x="880" y="354">14 sensor.tilfordelergulv            floor supply after mixing valve</text>
    <text x="880" y="376">15 sensor.frafordelergulv            floor return</text>
    <text x="880" y="398">16 sensor.tempstue                  living room, DS18B20 (corrected -2.0 K)</text>
    <text x="880" y="420">17 sensor.tempstue2                 living room, BME280 (corrected -2.9 K)</text>

    <text x="880" y="460" font-weight="bold">Not placed</text>
    <text x="880" y="480" font-size="11">7  turcompressor, returcompressor: location unknown (do not assume).</text>
    <text x="880" y="498" font-size="11">tempgarasje: not on the water loop.</text>
    <text x="880" y="516" font-size="11">Backup heater: not on the drawing. Contactor is binary_sensor.espaltherma_electric_heater_contactor.</text>
    <text x="880" y="534" font-size="11">Floor mixing valve bypass: not drawn in full (see system drawing).</text>

    <text x="880" y="570" font-size="11" fill="#555">Paths: red = supply, blue = return. Dashed = outdoor link.</text>
    <text x="880" y="588" font-size="11" fill="#555">Stein's system drawing is the source of the layout; positions are schematic.</text>
  </g>
</svg>
