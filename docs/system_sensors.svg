<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010" font-family="Segoe UI, Arial, sans-serif">
  <title>AlthermaInterface water circuit with temperature sensors and data sources</title>
  <rect width="1000" height="1010" fill="#ffffff"/>

  <!-- ===== Diagram (follows the system drawing) ===== -->

  <!-- Outdoor unit and refrigerant/water link -->
  <rect x="92" y="230" width="90" height="90" rx="6" fill="#f3efe9" stroke="#888"/>
  <text x="137" y="270" text-anchor="middle" font-size="13">Outdoor</text>
  <text x="137" y="288" text-anchor="middle" font-size="13">unit</text>
  <line x1="182" y1="255" x2="222" y2="255" stroke="#999" stroke-dasharray="5 4"/>
  <line x1="182" y1="290" x2="222" y2="290" stroke="#999" stroke-dasharray="5 4"/>
  <text x="137" y="340" text-anchor="middle" font-size="11" fill="#555">Refrigerant / water</text>

  <!-- DHW tank with coil -->
  <rect x="232" y="40" width="100" height="120" rx="6" fill="#f8f0e3" stroke="#8a6d3b"/>
  <text x="282" y="68" text-anchor="middle" font-size="13">DHW tank</text>
  <path d="M250 100 H300 L262 112 L300 124 L262 136 L300 148" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- DHW coil: supply up from the 3-way valve, return down to the indoor unit -->
  <path d="M312 245 V150" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M246 160 V210" stroke="#2471a3" stroke-width="3" fill="none"/>
  <polygon points="246,212 242,202 250,202" fill="#2471a3"/>

  <!-- Indoor unit -->
  <rect x="222" y="210" width="120" height="130" rx="6" fill="#e6f4ef" stroke="#2e7d6b"/>
  <text x="282" y="232" text-anchor="middle" font-size="13">Indoor unit</text>
  <path d="M246 300 V250 H262" stroke="#2471a3" stroke-width="3" fill="none"/>
  <circle cx="272" cy="250" r="10" fill="#ffffff" stroke="#2e7d6b"/>
  <text x="272" y="254" text-anchor="middle" font-size="9">P0</text>
  <circle cx="312" cy="250" r="9" fill="#ffffff" stroke="#2e7d6b"/>
  <text x="282" y="282" text-anchor="middle" font-size="10">3-way valve</text>
  <!-- Return into the indoor unit from the junction -->
  <path d="M292 380 V330" stroke="#2471a3" stroke-width="3" fill="none"/>
  <circle cx="292" cy="380" r="4" fill="#2471a3"/>
  <!-- Supply out of the indoor unit to the buffer -->
  <path d="M321 250 H382" stroke="#c0392b" stroke-width="3" fill="none"/>

  <!-- Buffer tank -->
  <rect x="382" y="180" width="90" height="220" rx="8" fill="#f9ece6" stroke="#b35c3a"/>
  <text x="427" y="300" text-anchor="middle" font-size="13">Buffer tank</text>
  <!-- Buffer return to junction -->
  <path d="M382 380 H292" stroke="#2471a3" stroke-width="3" fill="none"/>

  <!-- Buffer outlet and split to house and floor -->
  <path d="M472 205 H500" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M500 150 V300" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- House branch with P1 -->
  <path d="M500 150 H532" stroke="#c0392b" stroke-width="3" fill="none"/>
  <circle cx="543" cy="150" r="11" fill="#ffffff" stroke="#4a4e9c"/>
  <text x="543" y="154" text-anchor="middle" font-size="10">P1</text>
  <path d="M554 150 H592" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Floor branch: mixing valve, then P2 -->
  <polygon points="518,288 530,300 518,312 506,300" fill="#ffffff" stroke="#4a4e9c"/>
  <path d="M500 300 H506" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M530 300 H551" stroke="#c0392b" stroke-width="3" fill="none"/>
  <circle cx="562" cy="300" r="11" fill="#ffffff" stroke="#4a4e9c"/>
  <text x="562" y="304" text-anchor="middle" font-size="10">P2</text>
  <path d="M573 300 H592" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="530" y="352" text-anchor="middle" font-size="11" fill="#555">Mixing valve</text>
  <!-- Bypass from floor return back to the mixing valve -->
  <path d="M518 312 V400 H642" stroke="#2471a3" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="600" y="416" text-anchor="middle" font-size="11" fill="#555">Bypass</text>

  <!-- House, direct circuit -->
  <rect x="592" y="122" width="100" height="56" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="642" y="146" text-anchor="middle" font-size="13">House</text>
  <text x="642" y="164" text-anchor="middle" font-size="11" fill="#4a4e9c">Direct circuit</text>
  <!-- House return: down the right side to the common return -->
  <path d="M692 178 H708 V440 H292 V380" stroke="#2471a3" stroke-width="3" fill="none"/>

  <!-- Floor, mixed circuit -->
  <rect x="592" y="274" width="100" height="56" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="642" y="298" text-anchor="middle" font-size="13">Floor</text>
  <text x="642" y="316" text-anchor="middle" font-size="11" fill="#4a4e9c">Mixed circuit</text>
  <!-- Floor return down to the common return -->
  <path d="M642 330 V440" stroke="#2471a3" stroke-width="3" fill="none"/>

  <!-- Living room, not on the water loop -->
  <rect x="740" y="60" width="160" height="60" rx="6" fill="#eef0fb" stroke="#4a4e9c"/>
  <text x="820" y="86" text-anchor="middle" font-size="12">Living room</text>
  <text x="820" y="104" text-anchor="middle" font-size="10" fill="#555">not on the water loop</text>

  <!-- Legend for path colours -->
  <path d="M200 478 H230" stroke="#c0392b" stroke-width="3"/>
  <text x="236" y="482" font-size="11">Supply</text>
  <path d="M300 478 H330" stroke="#2471a3" stroke-width="3"/>
  <text x="336" y="482" font-size="11">Return</text>
  <line x1="400" y1="478" x2="430" y2="478" stroke="#999" stroke-dasharray="5 4"/>
  <text x="436" y="482" font-size="11">Outdoor link</text>

  <!-- ===== Sensor markers ===== -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="137" cy="212" r="10" fill="#fff6d6" stroke="#b08900"/><text x="137" y="216">1</text>
    <circle cx="300" cy="336" r="10" fill="#d6f0e0" stroke="#1e7a4a"/><text x="300" y="340">2</text>
    <circle cx="262" cy="352" r="10" fill="#d6f0e0" stroke="#1e7a4a"/><text x="262" y="356">3</text>
    <circle cx="342" cy="226" r="10" fill="#d6f0e0" stroke="#1e7a4a"/><text x="342" y="230">4</text>
    <circle cx="350" cy="272" r="10" fill="#d6e6f6" stroke="#1f5fa0"/><text x="350" y="276">5</text>
    <circle cx="340" cy="458" r="10" fill="#d6e6f6" stroke="#1f5fa0"/><text x="340" y="462">6</text>
    <circle cx="262" cy="170" r="10" fill="#d6f0e0" stroke="#1e7a4a"/><text x="262" y="174">8</text>
    <circle cx="372" cy="250" r="10" fill="#fff6d6" stroke="#b08900"/><text x="372" y="254">9</text>
    <circle cx="486" cy="190" r="10" fill="#fff6d6" stroke="#b08900"/><text x="486" y="194">10</text>
    <circle cx="340" cy="392" r="10" fill="#fff6d6" stroke="#b08900"/><text x="340" y="396">11</text>
    <circle cx="512" cy="186" r="10" fill="#fff6d6" stroke="#b08900"/><text x="512" y="190">12</text>
    <circle cx="700" cy="310" r="10" fill="#fff6d6" stroke="#b08900"/><text x="700" y="314">13</text>
    <circle cx="582" cy="286" r="10" fill="#fff6d6" stroke="#b08900"/><text x="582" y="290">14</text>
    <circle cx="656" cy="384" r="10" fill="#fff6d6" stroke="#b08900"/><text x="656" y="388">15</text>
    <circle cx="790" cy="108" r="10" fill="#e4e6f7" stroke="#4a4e9c"/><text x="790" y="112">16</text>
    <circle cx="850" cy="108" r="10" fill="#e4e6f7" stroke="#4a4e9c"/><text x="850" y="112">17</text>
  </g>

  <!-- ===== Table: sensors ===== -->
  <text x="20" y="530" font-size="15" font-weight="bold">Temperature sensors and data sources</text>
  <text x="20" y="548" font-size="11" fill="#555">Green: heat pump, native. Blue: ESPEasy node, pipe clamp. Yellow: ESPEasy node, circuit or tank. Node assignments from project notes; confirm.</text>

  <!-- column headers -->
  <rect x="20" y="560" width="960" height="24" fill="#e9ecef"/>
  <text x="30" y="577" font-size="12" font-weight="bold">#</text>
  <text x="60" y="577" font-size="12" font-weight="bold">Location</text>
  <text x="400" y="577" font-size="12" font-weight="bold">Direct from Altherma unit?</text>
  <text x="680" y="577" font-size="12" font-weight="bold">HA sensor name</text>

  <g font-size="12">
    <!-- row 1 -->
    <rect x="20" y="584" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="600">1</text><text x="60" y="600">Outdoor air</text><text x="400" y="600">No, ESPEasy node .160</text><text x="680" y="600">sensor.tempute</text>
    <!-- row 2 -->
    <rect x="20" y="606" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="622">2</text><text x="60" y="622">Refrigerant liquid, indoor unit</text><text x="400" y="622">Yes, X10A</text><text x="680" y="622">sensor.espaltherma_refrig_temp_liquid_sidec</text>
    <!-- row 3 -->
    <rect x="20" y="628" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="644">3</text><text x="60" y="644">Heat pump water inlet</text><text x="400" y="644">Yes, X10A</text><text x="680" y="644">sensor.espaltherma_inlet_water_tempc</text>
    <!-- row 4 -->
    <rect x="20" y="650" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="666">4</text><text x="60" y="666">Heat pump water outlet</text><text x="400" y="666">Yes, X10A</text><text x="680" y="666">sensor.espaltherma_outlet_water_tempc</text>
    <!-- row 5 -->
    <rect x="20" y="672" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="688">5</text><text x="60" y="688">Heat pump flow pipe (location to confirm)</text><text x="400" y="688">No, ESPEasy node .160</text><text x="680" y="688">sensor.turmaskin</text>
    <!-- row 6 -->
    <rect x="20" y="694" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="710">6</text><text x="60" y="710">Heat pump return pipe (location to confirm)</text><text x="400" y="710">No, ESPEasy node .160</text><text x="680" y="710">sensor.returmaskin</text>
    <!-- row 7 -->
    <rect x="20" y="716" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="732">7</text><text x="60" y="732">Compressor flow and return (not placed)</text><text x="400" y="732">No, ESPEasy node .160</text><text x="680" y="732">sensor.turcompressor, sensor.returcompressor</text>
    <!-- row 8 -->
    <rect x="20" y="738" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="754">8</text><text x="60" y="754">DHW tank</text><text x="400" y="754">Yes, X10A</text><text x="680" y="754">sensor.espaltherma_dhw_tank_tempc</text>
    <!-- row 9 -->
    <rect x="20" y="760" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="776">9</text><text x="60" y="776">Buffer top, heat pump supply in</text><text x="400" y="776">No, ESPEasy node (confirm)</text><text x="680" y="776">sensor.tempinnlagertank</text>
    <!-- row 10 -->
    <rect x="20" y="782" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="798">10</text><text x="60" y="798">Buffer top, supply to consumers (turlager)</text><text x="400" y="798">No, ESPEasy node (confirm)</text><text x="680" y="798">sensor.turlager</text>
    <!-- row 11 -->
    <rect x="20" y="804" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="820">11</text><text x="60" y="820">Buffer bottom, return to indoor unit</text><text x="400" y="820">No, ESPEasy node (confirm)</text><text x="680" y="820">sensor.temputlagertank</text>
    <!-- row 12 -->
    <rect x="20" y="826" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="842">12</text><text x="60" y="842">Manifold, house flow (same pipe as 10)</text><text x="400" y="842">No, ESPEasy node .162 (confirm)</text><text x="680" y="842">sensor.temputfordeler</text>
    <!-- row 13 -->
    <rect x="20" y="848" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="864">13</text><text x="60" y="864">House return to common return</text><text x="400" y="864">No, ESPEasy node .162 (confirm)</text><text x="680" y="864">sensor.tempreturfordeler</text>
    <!-- row 14 -->
    <rect x="20" y="870" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="886">14</text><text x="60" y="886">Floor supply after mixing valve</text><text x="400" y="886">No, ESPEasy node .162 (confirm)</text><text x="680" y="886">sensor.tilfordelergulv</text>
    <!-- row 15 -->
    <rect x="20" y="892" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="908">15</text><text x="60" y="908">Floor return</text><text x="400" y="908">No, ESPEasy node .162 (confirm)</text><text x="680" y="908">sensor.frafordelergulv</text>
    <!-- row 16 -->
    <rect x="20" y="914" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="930">16</text><text x="60" y="930">Living room, DS18B20 (corrected -2.0 K)</text><text x="400" y="930">No, ESPEasy node .161</text><text x="680" y="930">sensor.tempstue</text>
    <!-- row 17 -->
    <rect x="20" y="936" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="952">17</text><text x="60" y="952">Living room, BME280 (corrected -2.9 K)</text><text x="400" y="952">No, ESPEasy node .161</text><text x="680" y="952">sensor.tempstue2</text>
    <!-- row: derived and binary -->
    <rect x="20" y="958" width="960" height="22" fill="#f6f7f8"/>
    <text x="30" y="974">-</text><text x="60" y="974">Compressor state (derived, not a sensor)</text><text x="400" y="974">No, from outdoor PowerMeter current</text><text x="680" y="974">binary_sensor.espaltherma_compressor</text>
    <!-- row: not on loop -->
    <rect x="20" y="980" width="960" height="22" fill="#ffffff"/>
    <text x="30" y="996">-</text><text x="60" y="996">Garage (not on the water loop)</text><text x="400" y="996">No, ESPEasy node</text><text x="680" y="996">sensor.tempgarasje</text>
  </g>
</svg>
